    <meta property="og:title" content="تحليل السيرة الذاتية | Career Start">

</head>
<body>
    <div class="bg-decorations"><div class="glow-orb orb-1"></div><div class="glow-orb orb-2"></div><div class="grid-overlay"></div></div>
    <div class="tech-bg-grid"></div><div class="glow-orb orb-top-left"></div><div class="glow-orb orb-bottom-right"></div>
<header class="navbar">
        <div class="logo"><a href="../index.html" style="color: inherit; text-decoration: none;">Career Start<span>AI</span></a></div>
        <nav>
            <a href="../index.html">الرئيسية</a>
            <a href="quiz.html">تحديد المسار</a>

        <a href="soft-skills.html">المهارات الشخصية</a></nav>
    </header>
    <main>
        <section class="cv-analyzer-standalone">
            <h1>تحليل السيرة الذاتية</h1><p>الصق النص أو اختر ملف PDF أو DOCX أو TXT. يمكنك استخدام التحليل المحلي حتى عند انقطاع الخدمة.</p>
            <form id="cvAnalyzerForm" novalidate>
                <label for="cvTargetField">المجال المستهدف</label>
                <select id="cvTargetField" name="targetField"><option value="Programming">البرمجة</option><option value="UI-UX">تصميم UI/UX</option><option value="Graphic Design">التصميم الجرافيكي</option></select>
                <label for="cvFileInput">ملف السيرة (PDF أو DOCX أو TXT، حتى 3 ميجابايت)</label><input id="cvFileInput" type="file" accept=".pdf,.docx,.txt">
                <label for="cvTextInput">أو الصق نص السيرة الذاتية</label><textarea id="cvTextInput" rows="10" maxlength="12000" placeholder="الصق الخبرات والتعليم والمشاريع والمهارات…"></textarea>
                <p id="cvCharCount">0 / 6000</p><div id="cvFormMessage" role="status" aria-live="polite" hidden></div>
                <button id="analyzeCvBtn" class="btn-primary" type="submit">حلّل سيرتي الذاتية</button>
            </form><section id="cvAnalysisResult" aria-live="polite" hidden></section>
        </section>
    </main>
    <footer><p>© 2026 جميع الحقوق محفوظة - منصة career start</p><a href="soft-skills.html">المهارات الشخصية</a>

<script src="../js/shell.js"></script>
